
name: Testes de Integração - Xadrez

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  integration-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Instalar Godot 4.7.2
        uses: solarlabyrinth/action-setup-godot@v3
        with:
          version: 4.7.2-stable
          export-templates: false

      - name: Importar projeto Godot
        run: |
          godot --headless --editor --path . --import

      - name: Executar testes GUT
        run: |
          godot --headless --path . \
            -s res://addons/gut/gut_cmdln.gd \
            -gdir=res://tests/integration \
            -gexit
